<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>弥音启动器</title>
  </head>
  <body>
    <!--
      静态占位：前端真正挂上之前，这里就是用户看到的全部。
      没有它的话，脚本一失败（打包产物没起来 / 模块执行出错）窗口里就是一片纯白，
      用户只能去任务管理器杀掉。所以它必须是**不依赖 JS** 的 HTML + 内联样式
      （CSP 是 default-src 'self'，内联 script 会被拒；内联 style 是放行的）。
      挂载点保持 id="app"，main.tsx 在 render 之前会清掉这里的内容。
    -->
    <div id="app">
      <div
        style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 32px; background: #0b0e18; color: #c9d3ea; font: 14px/1.6 'Microsoft YaHei UI', 'Segoe UI', system-ui, sans-serif; text-align: center"
      >
        <p style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.4px">正在启动弥音启动器…</p>
        <p style="margin: 0; font-size: 12.5px; color: #7c88a6">
          一直停在这里说明前端没能加载。可以先
          <a href="/index.html" style="color: #7aa2f7">重新加载</a>
          ；还是不行的话，可能是系统缺少 <b style="font-weight: 600">WebView2 运行时</b>
          （重装过系统 / 精简版系统常见），装上 Microsoft Edge WebView2 Runtime 再打开即可。
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
