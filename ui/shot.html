<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#1b1d21}iframe{display:block;width:1280px;height:900px;border:0}</style>
<iframe id="f" src="/index.html?theme=dark"></iframe>
<script>
  let stage = 0;
  setInterval(() => {
    try {
      const d = document.getElementById("f").contentDocument;
      if (!d) return;
      // 演示模式自带的弹窗挡着，每轮都清（Vue 会渲染回来）
      d.querySelectorAll(".sheet").forEach((n) => n.remove());
      if (stage === 0) {
        const tab = [...d.querySelectorAll("button")].find((n) => n.textContent.trim() === "模组");
        if (tab) { tab.click(); stage = 1; }
      }
    } catch (e) {}
  }, 70);
</script>
