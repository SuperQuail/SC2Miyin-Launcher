name: 功能建议 / Feature request
description: 希望启动器能做什么
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 说说场景，而不是直接给方案 —— 这样更容易找到更合适的做法
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
      description: 可选
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 现在是怎么绕过去的
      description: 现在的替代办法，能帮我们判断这件事有多值得做
    validations:
      required: false