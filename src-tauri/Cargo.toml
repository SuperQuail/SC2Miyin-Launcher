[package]
name = "miyin-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "弥音启动器 —— 星际争霸 II 战役与 Mod 管理器"

[lib]
name = "miyin_launcher"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建**必须**开这个：开了才会把 ui/dist 内嵌进二进制。
#
# 不开的话 release 版也会去连 devUrl（开发服务器），在没有 dev server 的机器上
# 就是一片 ERR_CONNECTION_REFUSED。这个坑踩过一次，别再删。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
miyin-core = { path = "../crates/miyin-core" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = ["tray-icon"] }
# 版本必须跟 wry 0.55 用的一致（0.38），否则 COM 类型对不上
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Interface::cast 从这个 crate 来；版本要跟 wry 0.55 用的一致（0.61）
# Win32_UI_Controls / Graphics_Gdi / LibraryLoader 是缺 WebView2 时的原生进度窗要用的（webview2_install.rs）
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  # CreateMutexW / CreateEventW 的参数类型 SECURITY_ATTRIBUTES 在这个 feature 后面
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
# 注册表兜底探测 WebView2 运行时（与 miyin-core 用的是同一个 crate，不新增依赖树）
winreg = "0.56.0"
